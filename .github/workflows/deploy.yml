name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/determined-hawking-hcq05w]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site lives at the root of its address when the repo is the user site
      # (itsharshhy.github.io) or has a custom domain (public/CNAME); otherwise it
      # lives under the repo name, e.g. https://itsharshhy.github.io/portfolio-/.
      - name: Pick the base path
        run: |
          name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%%/*}"
          if [ "$name" = "$owner.github.io" ] || [ -s public/CNAME ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/$name/" >> "$GITHUB_ENV"
          fi
      - run: npm run build
      # GitHub Pages has no rewrites: give every page its own index.html so deep links
      # (like /about) load with a normal 200, and keep 404.html as a fallback for anything else.
      - run: |
          cp dist/index.html dist/404.html
          for r in about contact work work/plant-a-thought work/pebble work/seven-wonders-studio; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
